<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cercador de preguntes oficials de PAU i Competències Bàsiques de Catalunya: cerca per paraules clau, solucions oficials, còpia al porta-retalls i fitxes imprimibles." />
    <title>Banc de proves oficials — Cerca de preguntes PAU i CCBB</title>
  </head>
  <body>
    <div id="app">
      <!-- Capçalera -->
      <header class="sticky top-0 z-20 border-b border-slate-200 bg-white/95 backdrop-blur">
        <div class="mx-auto flex max-w-5xl flex-wrap items-center gap-3 px-4 py-3">
          <h1 class="mr-auto text-lg font-bold text-slate-800">📐 Banc de proves oficials</h1>
          <a href="https://adriasantacreu.github.io" class="text-sm text-slate-500 hover:text-slate-800">Portafoli</a>
          <button id="cart-button" type="button" class="btn-secondary text-sm">🧺 Fitxa <span id="cart-badge" class="font-semibold">0</span></button>
        </div>
      </header>

      <main class="mx-auto max-w-5xl px-4 py-6">
        <!-- Cerca + filtres -->
        <section aria-label="Cerca i filtres" class="p-4 rounded-xl border border-slate-200 bg-white shadow-sm">
          <input
            id="search-input"
            type="search"
            placeholder="Cerca: «matriu», «probabilitat condicionada», «recta tangent»…"
            autocomplete="off"
            class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-base outline-none focus:border-slate-500 focus:ring-2 focus:ring-slate-200"
          />
          <div id="filters" class="mt-3 flex flex-wrap items-center gap-2 text-sm"></div>
          <p id="results-count" class="mt-3 text-sm text-slate-500" aria-live="polite">Carregant catàleg…</p>
        </section>

        <!-- Contenidor de resultats -->
        <section id="results" aria-label="Resultats" class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2"></section>
        <section id="empty-state" hidden class="mt-6 rounded-xl border border-dashed border-slate-300 bg-white p-10 text-center">
          <p class="text-lg font-medium text-slate-600">No s'han trobat preguntes</p>
          <p class="mt-1 text-sm text-slate-400">Prova-ho amb termes més curts o treu algun filtre. Suggeriments:</p>
          <p id="suggeriments" class="mt-3 flex flex-wrap justify-center gap-2"></p>
          <button id="reset-filtres" type="button" class="btn-secondary mt-4 text-xs">Neteja la cerca i els filtres</button>
        </section>
      </main>

      <footer class="mx-auto max-w-5xl px-4 py-8 text-center text-sm text-slate-400">
        Fets amb captures oficials a 200 DPI · <a class="underline hover:text-slate-600" href="https://github.com/adriasantacreu/banc-proves-oficials">Codi font</a>
      </footer>
    </div>

    <!-- Panell del carret -->
    <aside id="cart-panel" hidden class="no-print fixed inset-y-0 right-0 z-40 w-full max-w-md bg-white shadow-2xl border-l border-slate-200 flex flex-col" aria-label="Carret de preguntes">
      <div class="flex items-center justify-between px-4 py-3 border-b border-slate-200">
        <h2 class="font-bold">Fitxa en curs (<span id="cart-count">0</span>)</h2>
        <button id="cart-tanca" type="button" class="btn-secondary text-xs">Tanca</button>
      </div>
      <ul id="cart-llista" class="flex-1 overflow-y-auto divide-y divide-slate-100"></ul>
      <div class="border-t border-slate-200 p-4 flex flex-wrap gap-2">
        <button id="fitxa-genera" type="button" class="btn-primary text-sm flex-1">🖨️ Genera fitxa imprimible</button>
        <button id="cart-buida" type="button" class="btn-secondary text-sm">Buida</button>
      </div>
    </aside>

    <!-- Vista de fitxa (F5) -->
    <section id="fitxa" aria-label="Fitxa imprimible" class="min-h-screen py-6 px-2">
      <div class="no-print mx-auto max-w-3xl mb-4 flex flex-wrap gap-2">
        <button id="fitxa-imprimeix" type="button" class="btn-primary text-sm">🖨️ Imprimeix / Desa com a PDF</button>
        <button id="fitxa-torna" type="button" class="btn-secondary text-sm">← Torna al cercador</button>
        <button id="fitxa-buida" type="button" class="btn-secondary text-sm ml-auto">Buida la fitxa</button>
      </div>
      <div id="fitxa-contingut"></div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
